[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asea"
version = "0.1.0"
description = "Autonomous Software Engineering Agent"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "gitpython>=3.1.0",
    "pygithub>=2.0.0",
    "docker>=7.1.0",
    "rich>=13.0.0",
    "tree-sitter==0.25.0",
    "tree-sitter-python==0.25.0",
]

[project.optional-dependencies]
github = [
    "pygithub>=2.0.0",
]
llm = [
    "openai>=1.0.0",
]
api = [
    "fastapi==0.115.12",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "sse-starlette==2.2.1",
    "langgraph-checkpoint-sqlite==3.1.3",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "semgrep>=1.0.0",
]

[project.scripts]
asea = "asea.cli:app"

[tool.setuptools.packages.find]
include = ["asea*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]